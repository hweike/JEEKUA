<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>产品采集助手</title>
  <style>
    body { width: 320px; padding: 12px; font-family: sans-serif; }
    h3 { margin:0 0 8px; }
    .token-section { margin-bottom: 12px; }
    input { width: 100%; padding: 6px; margin: 6px 0; box-sizing: border-box; }
    button { width: 100%; padding: 8px; margin-top: 4px; background: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:disabled { background: #9ca3af; }
    #status { margin-top: 8px; font-size: 12px; }
    .hint { font-size: 11px; color: #6b7280; margin-top: 4px; }
  </style>
</head>
<body>
  <h3>🔌 产品采集助手</h3>
  <div class="token-section">
    <label>API Token:</label>
    <input type="text" id="tokenInput" placeholder="粘贴您的Token">
    <button id="saveTokenBtn">保存 Token</button>
    <div class="hint">💡 请在后台「产品采集」页面点击「获取API Token」后复制粘贴到这里</div>
  </div>
  <button id="collectBtn">采集当前商品</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
