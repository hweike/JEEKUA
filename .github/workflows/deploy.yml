name: Build, Package and Deploy to AWS Lightsail

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 打包项目源码（不含 node_modules/.next/data）
        run: |
          mkdir -p deploy_artifact
          # 复制项目文件（排除 node_modules, .next, data, .git, 等）
          rsync -av --exclude='node_modules' --exclude='.next' --exclude='data' --exclude='.git' --exclude='deploy_artifact' --exclude='deploy.tar.gz' ./ deploy_artifact/
          # 确保 package.json 等必须文件存在
          cp package.json package-lock.json deploy_artifact/
          # 创建 .env.production 占位（实际环境变量应在服务器上设置）
          echo "DEEPSEEK_API_KEY=build_dummy_key" >> deploy_artifact/.env.production
          echo "DEEPSEEK_BASE_URL=https://api.deepseek.com" >> deploy_artifact/.env.production
          tar -czf deploy.tar.gz -C deploy_artifact .

      - name: 通过 SCP 上传压缩包
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/home/ubuntu/"
          timeout: 30m
          command_timeout: 30m
          overwrite: true

      - name: 在服务器上解压、安装依赖、构建并启动
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          timeout: 30m
          command_timeout: 30m
          script: |
            set -e
            APP_DIR="/www/wwwroot/feisman-power"
            BACKUP_DIR="/tmp/feisman_data_backup_$(date +%Y%m%d_%H%M%S)"

            # 备份 data 目录
            if [ -d "$APP_DIR/data" ]; then
              echo "Backing up data..."
              cp -r $APP_DIR/data $BACKUP_DIR
            fi

            # 清空并重建项目目录
            sudo rm -rf $APP_DIR
            sudo mkdir -p $APP_DIR
            sudo chown ubuntu:ubuntu $APP_DIR

            cd /home/ubuntu
            tar -xzf deploy.tar.gz -C $APP_DIR
            rm -f deploy.tar.gz

            # 恢复 data 目录
            if [ -d "$BACKUP_DIR" ]; then
              echo "Restoring data..."
              cp -r $BACKUP_DIR $APP_DIR/data
              rm -rf $BACKUP_DIR
            else
              mkdir -p $APP_DIR/data
            fi

            cd $APP_DIR

            # 安装生产依赖（自动编译原生模块）
            export NODE_OPTIONS="--max_old_space_size=1536"
            npm install --omit=dev --fetch-retries=5

            # 构建 Next.js
            npm run build

            # 创建 .env.local（真实环境变量）
            cat > .env.local << 'EOF'
            NODE_ENV=production
            JWT_SECRET=LHjK20LkUbYVLazrb16ueQLPmZmkkPuuzt7r1tyVejw
            DEEPSEEK_API_KEY=sk-d736ef3755c243c6aafc99cf160f2895
            DEEPSEEK_BASE_URL=https://api.deepseek.com
            EOF

            # 使用 PM2 启动（监听 0.0.0.0）
            pm2 delete feisman-power 2>/dev/null || true
            pm2 start node_modules/.bin/next --name "feisman-power" -- start --hostname 0.0.0.0 --port 3000
            pm2 save

            echo "Deployment completed successfully."