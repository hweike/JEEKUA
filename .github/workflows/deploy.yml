name: Build and Package for Manual Deployment

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装依赖并构建
        env:
          NODE_OPTIONS: "--max_old_space_size=2048"
        run: |
          # 创建临时 .env.production，避免构建时缺少环境变量
          echo "DEEPSEEK_API_KEY=build_dummy_key" >> .env.production
          echo "DEEPSEEK_BASE_URL=https://api.deepseek.com" >> .env.production
          npm ci --omit=dev --fetch-retries=5
          npm run build

      - name: 打包构建产物（包含 node_modules）
        run: |
          mkdir -p deploy_artifact
          cp -r .next deploy_artifact/
          cp -r public deploy_artifact/
          cp package.json package-lock.json deploy_artifact/
          cp -r node_modules deploy_artifact/
          tar -czf deploy.tar.gz -C deploy_artifact .

      - name: 创建或更新 Release 并上传压缩包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-deploy
          name: "Latest Deploy Build"
          body: "自动构建产物，提交：${{ github.sha }}"
          files: deploy.tar.gz
          prerelease: true
          make_latest: true
          overwrite: true   # 覆盖已有的 latest-deploy release 中的同名文件
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}